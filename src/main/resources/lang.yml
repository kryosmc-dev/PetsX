# =====================================================================
#  MascotasX - IDIOMA / TEXTOS
#  Aquí puedes editar TODOS los textos del plugin. Usa formato MiniMessage
#  (<red>, <gold>, <bold>, <gradient:red:blue>, etc.).
#  Los %placeholders% se reemplazan solos; no los borres si quieres que se muestren.
#  Cada objeto de menú tiene "name" (nombre) y "lore" (lista de líneas).
#  Si una línea del lore es solo un %placeholder% y queda vacío, la línea se omite.
#  Tras editar usa /mascotas reload (o el panel admin > Recargar archivos).
#  Si borras una clave, vuelve a crearse sola con su valor original.
# =====================================================================

# ---------------------------------------------------------------- títulos de menús
titles:
  buy: "<dark_gray><bold>MENU</bold> | <gray>Comprar"
  pets: "<dark_gray><bold>MENU</bold> | <gray>Mascotas"
  data: "<dark_gray><bold>MENU</bold> | <gray>Datos"
  cosmetics: "<dark_gray><bold>MENU</bold> | <gray>Cosmeticos"
  levels: "<dark_gray><bold>MENU</bold> | <gray>%pet% (%page%/%pages%)"   # %pet% %page% %pages%
  effects: "<dark_gray><bold>MENU</bold> | <gray>Efectos"
  confirm: "<dark_gray><bold>MENU</bold> | <gray>Confirmar"

# ---------------------------------------------------------------- mensajes del chat
messages:
  prefix: "<gold><bold>MASCOTAS</bold> <dark_gray>» "
  no-pets: "<red>Aun no tienes ninguna mascota. <gray>Compra una con <yellow>/mascotas comprar"
  bought: "<green>Compraste a <yellow>%pet% <green>por <gold>%price%<green>."
  already-owned: "<red>Ya tienes esta mascota."
  no-money: "<red>No tienes suficiente dinero. Cuesta <gold>%price%<red>."
  summoned: "<green>Invocaste a <yellow>%pet%<green>."
  stored: "<gray>Guardaste a tu mascota."
  need-active: "<red>Primero invoca a esta mascota desde el menu de mascotas."
  level-up: "<yellow>%pet% <green>subio al <gold>nivel %level%<green>!"
  locked: "<red>Necesitas el nivel <gold>%level% <red>en esta mascota."
  not-mountable: "<red>Esta mascota no se puede montar."
  too-big: "<red>Esta mascota es demasiado grande para usarla de sombrero."
  name-prompt: "<yellow>Escribe el nuevo nombre en el chat <gray>(escribe <white>cancelar <gray>para salir)."
  name-set: "<green>Tu mascota ahora se llama <yellow>%name%<green>."
  name-cancel: "<gray>Cancelado."
  petted: "<light_purple>Acariciaste a tu mascota."
  reload: "<green>Configuracion recargada."
  no-perm: "<red>No tienes permiso."
  given: "<green>Listo: <yellow>%pet% <green>entregada a <yellow>%player%<green>."
  usage: "<gray>Uso: <yellow>/mascotas [comprar|guardar]"
  hold-item: "<red>Sostén en la mano el ítem que quieres ponerle a tu mascota."
  summon-fail: "<red>No se pudo invocar a tu mascota aqui."
  summon-fail-protected: "<red>No se pudo invocar a tu mascota aqui (zona protegida)."
  summon-fail-respawn: "<red>No se pudo invocar a tu mascota aqui. Invocala de nuevo desde el menu."
  only-players: "<red>Solo jugadores."
  usage-give: "<gray>Uso: <yellow>/mascotas dar <jugador> <id>"
  give-not-found: "<red>Jugador o mascota no encontrados."
  usage-level: "<gray>Uso: <yellow>/mascotas nivel <jugador> <nivel>"
  player-not-found: "<red>Jugador no encontrado."
  no-active-pet: "<red>Ese jugador no tiene una mascota invocada."
  invalid-level: "<red>Nivel invalido."
  level-set: "<green>Nivel actualizado."

# ---------------------------------------------------------------- barra de XP, título de subir nivel y nombre sobre la mascota
xp:
  text: "<yellow>%name% <gray>Lv.%level% <dark_gray>| %progress%%gain%"   # %name% %level% %progress% %gain%
  progress: "<green>%xp%<gray>/<green>%need% <gray>(%pct%%)"
  max: "<gold>NIVEL MÁXIMO"
  gain: " <aqua>+%gain% XP"
levelup:
  title: "<gold>¡Nivel %level%!"
  subtitle: "<yellow>%name%"
nametag: "<yellow>%name% <gray>[<white>Lv.%level%<gray>]"   # texto sobre la cabeza de la mascota

# ---------------------------------------------------------------- palabras sueltas reutilizadas por los menús
words:
  state-on: "<green>Activado"
  state-off: "<red>Desactivado"
  opt-yes: "<green>Sí"
  opt-no: "<red>No"
  none: "ninguno"
  summoned: "<green>Invocada"
  stored: "<red>Guardada"
  equipped: "<green>Equipado"
  not-equipped: "<red>No equipado"
  visible: "<green>Visible"
  hidden: "<red>Oculta"
  act-store: "guardar"
  act-summon: "invocar"
  act-store-it: "guardarla"
  act-summon-it: "invocarla"
  act-remove: "quitarlo"
  act-equip: "equiparlo"
  unlocked: "<green><bold>DESBLOQUEADO"
  locked: "<red><bold>BLOQUEADO"
  click-use: "<yellow>Click para usar"
  need-level: "<red>Requiere nivel %level%"
  buy-owned: "<red>✖ Ya tienes esta mascota"
  buy-click: "<yellow>Click para comprar"
  sort-default: "Por defecto"
  sort-damage: "Daño base (menor a mayor)"
  sort-price: "Precio (menor a mayor)"
  sort-selected: "<green>» <white>%mode%"
  sort-other: "<dark_gray>  <gray>%mode%"
  object-none: "ninguno (normal)"
  custom: "personalizado (%item%)"
  reward-money: "<gray>» Dinero: <green>%money%"
  reward-special: "<gray>» Recompensa especial"
  reward-effect: "<gray>» Desbloquea el efecto <aqua>%effect%"
  reward-hat: "<gray>» Desbloquea <aqua>usarla de sombrero"
  reward-mount: "<gray>» Desbloquea <aqua>montarla"
  reward-text: "<gray>» %text%"
  level-xp: "<gray>XP para este nivel: <white>%xp%"
  level-name: "<gold>%name% <white>Lvl. %level%"
  xp-line: "%bar% <gray>%xp%/%need%"

# ---------------------------------------------------------------- botones comunes
items:
  common:
    back:
      name: "<red>Volver"
    close:
      name: "<red>Cerrar"
    prev:
      name: "<green>« Anterior"
    next:
      name: "<green>Siguiente »"

  # ------------------------------------------------------------ menú Mascotas
  pets:
    pet:
      name: "<gold>%name%"
      lore:
        - " "
        - "<gray>Nivel: <white>%level%<gray>/%max%"
        - "%xpline%"
        - "<gray>Daño: <red>%damage%"
        - "<gray>Estado: %state%"
        - " "
        - "<yellow>Click izquierdo: <white>%action%"
        - "<yellow>Click derecho: <white>abrir datos"

  # ------------------------------------------------------------ menú Datos
  data:
    info:
      name: "<gold>%name%"
      lore:
        - " "
        - "<gray>Nivel: <white>%level%<gray>/%max%"
        - "%xpline%"
        - "<gray>Daño: <red>%damage%"
    mute:
      name: "<yellow>Silenciar"
      lore:
        - " "
        - "<gray>Estado: %state%"
        - " "
        - "<yellow>Click para cambiar"
    burn:
      name: "<yellow>Ardiendo"
      lore:
        - " "
        - "<gray>Estado: %state%"
        - " "
        - "<yellow>Click para cambiar"
    hand:
      name: "<green>Objeto"
    head:
      name: "<green>Cabeza"
    object:
      lore:
        - " "
        - "<gray>Actual: <white>%current%"
        - " "
        - "<yellow>Click con un ítem en la mano: <white>ponérselo"
        - "<yellow>Click derecho o Shift: <white>quitarlo"
    cosmetics:
      name: "<light_purple>Cosméticos"
      lore:
        - " "
        - "<gray>Montar, sombrero, nombrar,"
        - "<gray>voltear y más."
        - " "
        - "<yellow>Click para abrir"
    levels:
      name: "<green>Niveles"
      lore:
        - " "
        - "<gray>Mira las recompensas de cada nivel."
        - " "
        - "<yellow>Click para abrir"
    effects:
      name: "<aqua>Efectos"
      lore:
        - " "
        - "<gray>Efectos que te da tu mascota."
        - " "
        - "<yellow>Click para abrir"
    attack:
      name: "<red>Modo de ataque"
      lore:
        - " "
        - "<gray>Estado: %state%"
        - " "
        - "<yellow>Click para cambiar"
    summon-on:
      name: "<red>Guardar mascota"
      lore:
        - " "
        - "<yellow>Click para guardarla"
    summon-off:
      name: "<green>Invocar mascota"
      lore:
        - " "
        - "<yellow>Click para invocarla"

  # ------------------------------------------------------------ menú Cosméticos
  cosmetics:
    mount:
      name: "<gold>Montar"
      lore:
        - " "
        - "<gray>Súbete a tu mascota y recorre"
        - "<gray>el mundo con ella."
        - "%status%"
    hat:
      name: "<aqua>Sombrero"
      lore:
        - " "
        - "<gray>Lleva a tu mascota en la cabeza."
        - "%status%"
    name:
      name: "<yellow>Nombrar"
      lore:
        - " "
        - "<gray>Nombre actual: <white>%name%"
        - " "
        - "<yellow>Click para cambiar"
    flip:
      name: "<light_purple>Voltear"
      lore:
        - " "
        - "<gray>Estado: %state%"
        - " "
        - "<yellow>Click para cambiar"
    baby:
      name: "<green>Bebé"
      lore:
        - " "
        - "<gray>Gratis y sin subir niveles."
        - "<gray>Estado: %state%"
        - " "
        - "<yellow>Click para cambiar"
    baby-unavailable:
      name: "<red>Bebé"
      lore:
        - " "
        - "<gray>Este mob no tiene versión bebé."
    pet:
      name: "<light_purple>Acariciar"
      lore:
        - " "
        - "<gray>Dale cariño a tu mascota."
        - " "
        - "<yellow>Click para acariciar"
    color:
      name: "<gold>Color"
      lore:
        - " "
        - "<gray>Actual: <white>%current%"
        - " "
        - "<yellow>Click para cambiar"
    variant:
      name: "<gold>Aspecto"
      lore:
        - " "
        - "<gray>Variante: <white>%index%<gray>/%total%"
        - " "
        - "<yellow>Click para cambiar"
    extra:   # cosméticos únicos de cada mob (los nombres y opciones están en la sección "extras" de abajo)
      name: "<aqua>%name%"
      lore:
        - " "
        - "<gray>Actual: <white>%current%"
        - "<gray>Opción: <white>%index%<gray>/%total%"
        - " "
        - "<yellow>Click izq: <white>siguiente"
        - "<yellow>Click der: <white>anterior"
        - "<yellow>Shift: <white>restablecer"

  # ------------------------------------------------------------ menú Niveles
  levels:
    level:
      name: "%levelname%"
      lore:
        - " "
        - "<white>Recompensas:"
        - "<gray>» Otorga <green>+%bonus%%<gray> de bonificación de daño"
        - "%rewards%"
        - " "
        - "%status%"
        - "%xpneeded%"

  # ------------------------------------------------------------ menú Efectos
  effects:
    locked:
      name: "<red>%name%"
      lore:
        - " "
        - "<gray>Requiere nivel <white>%level%"
        - "<red>BLOQUEADO"
    effect:
      name: "<aqua>%name%"
      lore:
        - " "
        - "<gray>Estado: %state%"
        - "<gray>Solo puedes tener <white>1 <gray>efecto equipado."
        - "<gray>Se aplica mientras tu mascota esté invocada."
        - " "
        - "<yellow>Click para %action%"

  # ------------------------------------------------------------ tienda
  buy:
    pet:
      name: "<gold>%name%"
      lore:
        - " "
        - "<gray>Daño base: <red>%damage%"
        - "<gray>Precio: <green>%price%"
        - " "
        - "%status%"
    sort:
      name: "<aqua>Ordenar tienda"
      lore:
        - " "
        - "%modes%"
        - " "
        - "<yellow>Click para cambiar el orden"

  # ------------------------------------------------------------ confirmar compra
  confirm:
    pet:
      name: "<gold>%name%"
      lore:
        - " "
        - "<gray>Daño base: <red>%damage%"
        - "<gray>Precio: <green>%price%"
    accept:
      name: "<green><bold>CONFIRMAR"
      lore:
        - " "
        - "<gray>Comprar a <gold>%name%"
        - "<gray>por <green>%price%"
        - " "
        - "<yellow>Click para confirmar"
    cancel:
      name: "<red><bold>CANCELAR"
      lore:
        - " "
        - "<gray>Volver a la tienda sin comprar."
        - " "
        - "<yellow>Click para cancelar"

# ---------------------------------------------------------------- cosméticos únicos por mob
# Se rellena sola al iniciar el plugin: extras.<MOB>.<clave>.name y .labels (lista de opciones).
# Si cambias el número de opciones de una lista, se ignora y se usa la original.
extras: {}

